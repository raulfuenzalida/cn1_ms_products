server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-products
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/products_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:database/init.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/14c46308-ab91-4693-b0c0-daddd7a8aab5/v2.0}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

ms-config:
  base-url: ${MS_CONFIG_BASE_URL:http://localhost:8080}
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${PRODUCT_IMAGES_BUCKET:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://raulfuenzalida.github.io}

logging:
  level:
    duoc.cn1.ms_products: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
